id: as:example
name: Artifact Standards Example

method_type_tags:

  - id: as:artifact-evaluation
    name: Artifact Evaluation
    description: >
      Evaluation of research artifacts accompanying a scientific
      publication.

  - id: as:benchmarking
    name: Benchmarking
    description: >
      Studies that evaluate performance or behavior using benchmarks.


artifact_tags:

  - id: as:executable
    name: Executable
    description: >
      An artifact that can be executed to produce behavior or results.

  - id: as:tool
    name: Tool
    description: >
      A research software tool.

  - id: as:prototype
    name: Prototype
    description: >
      A research prototype or proof-of-concept.

  - id: as:data
    name: Data
    description: >
      A dataset or other research data artifact.


principles:

  - id: as:reproducible-installation
    name: Reproducible Installation — Generic

    method_type_tags:
      - as:artifact-evaluation
      - as:benchmarking

    artifact_tags:
      - as:executable
      - as:tool
      - as:prototype

    rationale: >
      Research artifacts may depend on specific operating systems,
      software packages, libraries, and system configurations.
      Providing a reproducible installation environment reduces
      installation problems during artifact evaluation and makes
      execution more reproducible.

    implementations:

      - id: as:container-or-vm
        name: Container or Virtual Machine

        check_level: hygiene

        method_type_tags:
          - as:artifact-evaluation

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype

        rationale: >
          Packaging the artifact together with its execution environment
          reduces dependency-related installation problems and allows
          evaluators to execute the artifact in a preconfigured environment.

        creation_guidance:

          description: >
            Authors must provide their artifacts as Container
            (Docker or Podman) or VM (OVF/OVA) images. If the artifact
            requires a different submission format, authors should
            contact the artifact evaluation committee chairs.

          examples:
            - Docker image
            - Podman/OCI image
            - OVF virtual machine
            - OVA virtual appliance

        checks_guidance:

          human:

            - id: as:container-vm-human-check

              description: >
                Verify that the submitted artifact includes a Container
                (Docker or Podman) or VM (OVF/OVA) image and that the
                provided instructions explain how to execute it.

              evidence:
                - Container image
                - Dockerfile or Containerfile
                - OVF/OVA image
                - Execution instructions

          automated:

            checks:

              - id: as:container-present

                description: >
                  Verify that a container build definition is present
                  in the artifact package.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory containing the submitted artifact.
                    type: directory
                    required: false
                    default: "."
                    examples:
                      - "."
                      - "./artifact"

                  - id: container_definition
                    description: >
                      Name of the container build definition.
                    type: file
                    required: false
                    default: "Dockerfile"
                    examples:
                      - Dockerfile
                      - Containerfile

                command: >
                  test -f "${artifact_root}/${container_definition}"

                expected_result: >
                  Exit code 0.

              - id: as:vm-present

                description: >
                  Verify that an OVF or OVA virtual machine artifact
                  is present.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory containing the submitted artifact.
                    type: directory
                    required: false
                    default: "."
                    examples:
                      - "."
                      - "./artifact"

                command: >
                  find "${artifact_root}" -type f
                  \( -name "*.ovf" -o -name "*.ova" \)

                expected_result: >
                  At least one matching file is found.

            combination_rules:

              - id: as:packaging-present

                operator: OR

                checks:
                  - as:container-present
                  - as:vm-present

                description: >
                  The packaging requirement is satisfied when either
                  a supported container build definition or a supported
                  OVF/OVA virtual machine image is present.

  - id: as:hardware-disclosure
    name: Hardware Environment Disclosure

    method_type_tags:
      - as:benchmarking
      - as:artifact-evaluation

    artifact_tags:
      - as:executable
      - as:tool
      - as:prototype

    rationale: >
      Performance results, timing measurements, and resource-sensitive
      behavior depend on the hardware an artifact was executed on.
      Without a record of the CPU, memory, storage, and accelerator
      configuration used, evaluators cannot interpret reported numbers,
      compare them across machines, or judge whether observed
      performance is reproducible on different hardware.

    implementations:

      - id: as:system-introspection-dump
        name: Raw System Introspection Dump

        method_type_tags:
          - as:benchmarking

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype

        rationale: >
          Capturing the verbatim output of standard system introspection
          utilities is the lowest-effort way to record the hardware an
          artifact ran on. It requires no hand-authored schema and is
          harder to misreport than a manually typed description, though
          it is not portable across operating systems and is not
          machine-checkable beyond file presence and shape.

        creation_guidance:

          description: >
            Authors should capture the output of standard hardware
            introspection tools (e.g., `lscpu -J`, `lshw -json`, `nproc`,
            `free -h`, and `nvidia-smi --query-gpu=... --format=csv` where
            a GPU was used) at the time benchmarks were run, and commit
            this output alongside the results as `hardware.json` and/or
            a human-readable `HARDWARE.md` summary at the artifact root.
            If benchmarks were run on more than one machine, authors
            should provide one dump per machine, named accordingly
            (e.g., `hardware-node1.json`).

          examples:
            - hardware.json (lscpu -J output)
            - hardware.json (lshw -json output)
            - HARDWARE.md (hand-summarized from the above)
            - hardware-node1.json / hardware-node2.json (multi-machine)

        checks_guidance:

          human:

            - id: as:hardware-dump-human-check

              description: >
                Verify that a hardware description file is present at
                the artifact root (one per machine, for multi-node
                benchmarks) and that it identifies at minimum the CPU
                model, core/thread count, and total memory used during
                the reported benchmarks; and, where a GPU was used, the
                GPU model and memory.

              evidence:
                - hardware.json
                - HARDWARE.md
                - Benchmark scripts referencing the hardware file

          automated:

            checks:

              - id: as:hardware-file-present

                description: >
                  Verify that a hardware description file is present
                  in the artifact package.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory containing the submitted artifact.
                    type: directory
                    required: false
                    default: "."
                    examples:
                      - "."
                      - "./artifact"

                  - id: hardware_file_pattern
                    description: >
                      Filename pattern(s) accepted as a hardware
                      description file.
                    type: string
                    required: false
                    default: "hardware*.json|HARDWARE.md"
                    examples:
                      - hardware.json
                      - hardware-node1.json
                      - HARDWARE.md

                command: >
                  find "${artifact_root}" -maxdepth 2 -type f
                  \( -iname "hardware*.json" -o -iname "HARDWARE.md" \)

                expected_result: >
                  At least one matching file is found.

              - id: as:hardware-json-well-formed

                description: >
                  Verify that any hardware.json file is well-formed
                  JSON and contains identifiable CPU information (a
                  "model name" field from lscpu, or a "product" field
                  under a class="processor" node from lshw).

                inputs:

                  - id: hardware_json_path
                    description: >
                      Path to the hardware.json file to validate.
                    type: file
                    required: false
                    default: "./hardware.json"
                    examples:
                      - "./hardware.json"
                      - "./hardware-node1.json"

                command: >
                  jq -e '.. | objects | select(has("model name") or
                  has("modelName") or has("product"))'
                  "${hardware_json_path}" > /dev/null

                expected_result: >
                  Exit code 0.

            combination_rules:

              - id: as:hardware-disclosure-satisfied

                operator: OR

                checks:
                  - as:hardware-file-present

                description: >
                  The disclosure requirement is satisfied when a
                  hardware description file is present. `as:hardware-json-valid`
                  is an additional quality check on well-formedness and
                  content, not required for the base requirement to
                  pass — this mirrors the ad hoc nature of the
                  practice: presence is checkable, semantic
                  completeness is not.

  - id: as:open-data-availability
    name: Open Data Availability — Generic

    rationale: >
      Empirical results can only be verified and built upon when the
      underlying data are accessible. Publishing raw or deidentified
      data under an open license allows independent reanalysis,
      error detection, and reuse in future studies.

    implementations:

      - id: as:data-availability-statement
        name: Data Availability Statement

        check_level: hygiene

        rationale: >
          A concise statement explaining what data are available and
          where—or why they cannot be released—gives readers the
          minimum information needed to assess openness and
          reproducibility.

        creation_guidance:

          description: >
            Include a dedicated data availability section in the paper
            (typically after the conclusion) and in the artifact README.
            Either provide a working URL or DOI to the deposited data,
            or explain why release is not possible (e.g., participant
            privacy, contractual restriction).

          examples:
            - Section "Data Availability" with a Zenodo DOI link
            - AVAILABILITY.md at the artifact root
            - Statement that interview transcripts cannot be released due to participant privacy

        checks_guidance:

          human:

            - id: as:data-availability-human-check

              description: >
                Verify that a data availability statement is present in
                the paper or artifact and that it either provides a
                working link to deposited data or gives a clear reason
                why data cannot be released.

              evidence:
                - Data availability section in the paper
                - AVAILABILITY.md or README section at artifact root
                - Working DOI or persistent URL to deposited data
                - Written justification for withholding data

          automated:

            checks:

              - id: as:data-availability-file-present

                description: >
                  Check that a data availability file or README is
                  present at the artifact root.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory of the submitted artifact.
                    type: directory
                    required: false
                    default: "."

                command: >
                  find "${artifact_root}" -maxdepth 2 -type f
                  \( -iname "AVAILABILITY*" -o -iname "DATA_AVAILABILITY*"
                  -o -iname "README*" \)

                expected_result: >
                  At least one matching file is found.

      - id: as:preserved-repository-deposit
        name: Preserved Repository Deposit

        check_level: quality

        rationale: >
          Personal websites, GitHub repositories, and consumer cloud
          services may disappear or become inaccessible. Depositing
          artifacts on a preserved academic repository (Zenodo, Figshare,
          OSF, Software Heritage) provides a persistent DOI and
          guarantees long-term availability.

        creation_guidance:

          description: >
            Deposit all supplementary materials on a preserved academic
            repository before submission and use the resulting DOI or
            persistent URL as the canonical reference. Do not rely
            solely on GitHub, personal websites, or commercial cloud
            storage as the primary deposit.

          examples:
            - Zenodo (zenodo.org) — free, DOI minted automatically
            - Figshare (figshare.com) — free, DOI minted automatically
            - OSF (osf.io) — persistent URL and optional DOI
            - Software Heritage (softwareheritage.org) — for source code archiving
            - Institutional data repository

        checks_guidance:

          human:

            - id: as:preserved-deposit-human-check

              description: >
                Verify that the artifact or its supplementary materials
                are deposited on a preserved repository (not only on
                GitHub or a personal website) and that a persistent DOI
                or URL is referenced in the paper or README.

              evidence:
                - Zenodo, Figshare, OSF, or Software Heritage deposit link
                - Persistent DOI in the paper, data availability section, or README

          automated:

            checks:

              - id: as:doi-in-readme

                description: >
                  Check that the artifact README references a DOI,
                  indicating deposit on a preserved repository.

                inputs:

                  - id: readme
                    description: >
                      Path to the artifact README file.
                    type: file
                    required: false
                    default: "README.md"

                command: >
                  grep -qiE "(doi\.org|10\.[0-9]{4,}/)" "${readme}"

                expected_result: >
                  Exit code 0 (a DOI pattern is found in the README).

  - id: as:open-artifact-licensing
    name: Open Artifact Licensing — Generic

    rationale: >
      Without an explicit open license, materials cannot legally be
      reused, modified, or redistributed even if they are publicly
      accessible. An open license makes reuse unambiguous and
      maximises the scientific value of released artifacts.

    implementations:

      - id: as:open-license-file
        name: Open License File

        check_level: quality

        rationale: >
          A LICENSE file at the artifact root makes the reuse terms
          unambiguous at a glance. CC0 and CC-BY 4.0 are preferred
          for data and documentation; MIT and Apache 2.0 are
          preferred for software.

        creation_guidance:

          description: >
            Place a LICENSE (or LICENSE.txt / LICENSE.md) file at the
            root of the artifact containing the full text of an open
            license. For data and documentation, prefer CC0 or CC-BY 4.0.
            For software, MIT or Apache 2.0 are widely accepted.

          examples:
            - LICENSE containing the CC-BY 4.0 full text
            - LICENSE containing the MIT license text
            - README with SPDX identifier line (SPDX-License-Identifier: CC0-1.0)

        checks_guidance:

          human:

            - id: as:open-license-human-check

              description: >
                Verify that an open license is clearly stated (in a
                LICENSE file or SPDX identifier) and that the chosen
                license permits reuse without unreasonable restrictions.

              evidence:
                - LICENSE or LICENSE.md file at artifact root
                - SPDX license identifier in README or source files
                - Open-source license badge in README

          automated:

            checks:

              - id: as:license-file-present

                description: >
                  Check that a LICENSE file is present at the artifact root.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory of the submitted artifact.
                    type: directory
                    required: false
                    default: "."

                command: >
                  find "${artifact_root}" -maxdepth 1 -type f
                  \( -iname "LICENSE" -o -iname "LICENSE.txt"
                  -o -iname "LICENSE.md" \)

                expected_result: >
                  At least one matching file is found.

              - id: as:open-license-content

                description: >
                  Check that the LICENSE file contains text associated
                  with a recognised open license.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory of the submitted artifact.
                    type: directory
                    required: false
                    default: "."

                command: >
                  find "${artifact_root}" -maxdepth 1 -type f -iname "LICENSE*"
                  -exec grep -lqiE
                  "creative commons|mit license|apache license|cc0|cc-by|bsd [0-9]"
                  {} \;

                expected_result: >
                  At least one LICENSE file contains open license text.

            combination_rules:

              - id: as:open-license-complete

                operator: AND

                checks:
                  - as:license-file-present
                  - as:open-license-content

                description: >
                  Both a LICENSE file must be present and it must
                  contain recognised open license text.

  - id: as:raw-benchmark-data-availability
    name: Raw Benchmark Data Availability — Generic

    method_type_tags:
      - as:benchmarking

    artifact_tags:
      - as:data
      - as:executable
      - as:tool

    rationale: >
      Benchmark results are only meaningful when the underlying raw
      measurements are available for verification and reanalysis.
      Reporting only aggregated statistics or plots prevents detection
      of anomalies, limits comparability across studies, and makes
      it impossible to apply alternative analysis methods.

    implementations:

      - id: as:structured-benchmark-data-file
        name: Structured Raw Data File

        check_level: quality

        method_type_tags:
          - as:benchmarking

        artifact_tags:
          - as:data
          - as:executable
          - as:tool

        rationale: >
          Raw measurements in a standard machine-readable format
          (CSV, TSV, JSON, Parquet) allow automated verification
          and reanalysis without re-executing potentially expensive
          benchmarks.

        creation_guidance:

          description: >
            Export one record per benchmark trial to a machine-readable
            file. Include a header row or schema description. Name the
            file clearly (e.g., results.csv, benchmark_raw.json) and
            place it at or near the artifact root or in a dedicated
            data/ directory.

          examples:
            - results.csv with columns benchmark, configuration, trial, runtime_ms
            - data/raw/benchmark_results.json
            - results/ directory with one CSV per configuration

        checks_guidance:

          human:

            - id: as:raw-data-human-check

              description: >
                Verify that raw trial-level measurements (not only
                summary statistics or plots) are present in a
                machine-readable format and that columns or fields
                are documented.

              evidence:
                - CSV, TSV, JSON, or Parquet file with individual trial measurements
                - Schema, column description, or codebook in README

          automated:

            checks:

              - id: as:benchmark-data-file-present

                description: >
                  Check that at least one structured data file is
                  present in the artifact.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory of the submitted artifact.
                    type: directory
                    required: false
                    default: "."

                command: >
                  find "${artifact_root}" -type f
                  \( -name "*.csv" -o -name "*.tsv" -o -name "*.json"
                  -o -name "*.parquet" -o -name "*.feather" \)

                expected_result: >
                  At least one structured data file is found.

      - id: as:benchmark-execution-scripts
        name: Benchmark Execution Scripts

        check_level: quality

        method_type_tags:
          - as:benchmarking

        artifact_tags:
          - as:executable
          - as:tool

        rationale: >
          Scripts that produced the benchmark results allow evaluators
          to verify that measurements were collected correctly and to
          re-run experiments on different hardware for comparison.

        creation_guidance:

          description: >
            Include all scripts used to execute benchmarks. Provide a
            clear entry point (e.g., run_benchmarks.sh, a Makefile
            target, or a single Python script) and document any
            required environment variables, input parameters, or
            expected runtime.

          examples:
            - run_benchmarks.sh
            - benchmark/run.py
            - Makefile with a "bench" or "benchmark" target
            - scripts/run_all.sh invoking individual benchmark scripts

        checks_guidance:

          human:

            - id: as:benchmark-scripts-human-check

              description: >
                Verify that scripts for running benchmarks are present,
                that a clear entry point is documented, and that the
                README explains how to invoke them and what output
                to expect.

              evidence:
                - Shell script, Python script, or Makefile for running benchmarks
                - README section describing benchmark execution

          automated:

            checks:

              - id: as:benchmark-script-present

                description: >
                  Check that at least one benchmark execution script
                  or Makefile is present in the artifact.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory of the submitted artifact.
                    type: directory
                    required: false
                    default: "."

                command: >
                  find "${artifact_root}" -type f
                  \( -name "run_benchmark*" -o -name "benchmark*"
                  -o -name "run_experiments*" -o -name "run_eval*"
                  -o -name "Makefile" \)

                expected_result: >
                  At least one matching file is found.
