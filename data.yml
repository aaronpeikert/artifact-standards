id: as:example
name: Artifact Standards Example

method_type_tags:

  - id: as:engineering-research
    name: Engineering Research
    description: >
      Research that invents and evaluates technological artifacts.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/EngineeringResearch

  - id: as:case-study
    name: Case Study
    description: >
      An empirical inquiry that investigates a contemporary phenomenon (the
      "case") in depth and within its real-world context, especially when the
      boundaries between phenomenon and context are unclear.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/CaseStudy

  - id: as:grounded-theory
    name: Grounded Theory
    description: >
      A study of a specific area of interest or phenomenon that involves
      iterative and interleaved rounds of qualitative data collection and
      analysis, leading to key patterns (e.g. concepts, categories).
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/GroundedTheory

  - id: as:qualitative-survey
    name: Qualitative Survey
    description: >
      Research comprising semi-structured or open-ended interviews.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/QualitativeSurveys

  # Quantitative
  - id: as:benchmarking
    name: Benchmarking
    description: >
      A study in which a software system is assessed using a standard tool
      (i.e. a benchmark) for competitively evaluating and comparing methods,
      techniques or systems according to specific characteristics such as
      performance, dependability, or security.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/Benchmarking

  - id: as:data-science
    name: Data Science
    description: >
      Studies that analyze software engineering phenomena or artifacts using
      data-centric analysis methods such as machine learning or other
      computational intelligence approaches as well as search-based approaches.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/DataScience

  - id: as:experiment
    name: Experiment
    description: >
      A study in which an intervention is deliberately introduced to observe
      its effects on some aspects of reality under controlled conditions.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/Experiments

  - id: as:longitudinal
    name: Longitudinal Study
    description: >
      A study focusing on the changes in and evolution of a phenomenon over
      time.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/Longitudinal

  - id: as:optimization-study
    name: Optimization Study
    description: >
      Research studies that focus on the formulation of software engineering
      problems as search problems, and apply optimization techniques to solve
      such problems.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/OptimizationStudies

  - id: as:quantitative-simulation
    name: Quantitative Simulation
    description: >
      A study that involves developing and using a mathematical model that
      imitates a real-world system's behavior, which often entails problem
      understanding, data collection, model development, verification,
      validation, design of experiments, data analysis, and implementation
      of results.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/QuantitativeSimulation

  - id: as:questionnaire-survey
    name: Questionnaire Survey
    description: >
      A study in which a sample of respondents answer a series of (mostly
      structured) questions, typically through a computerized or paper form.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/QuestionnaireSurveys

  - id: as:repository-mining
    name: Repository Mining
    description: >
      A study that quantitatively analyzes a dataset extracted from a platform
      hosting of structured or semi-structured text (e.g. a source code
      repository).
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/RepositoryMining

  # Literature Review
  - id: as:case-survey
    name: Case Survey
    description: >
      A study that aims to generalize results about a complex phenomenon by
      systematically converting qualitative descriptions available in published
      case studies into quantitative data and analyzing the converted data.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/CaseSurvey

  - id: as:systematic-review
    name: Systematic Review
    description: >
      A study that appraises, analyses, and synthesizes primary or secondary
      literature to provide a complete, exhaustive summary of current evidence
      regarding one or more specific topics or research questions.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/SystematicReviews

  # Other
  - id: as:meta-science
    name: Meta-Science
    description: >
      A paper that analyses an issue of research methodology or makes
      recommendations for conducting research.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/MetaScience

  - id: as:replication
    name: Replication
    description: >
      A study that deliberately repeats a previous study (the "original study")
      to determine whether its results can be reproduced.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/Replication


artifact_tags:

  - id: as:executable
    name: Executable
    description: >
      An artifact that can be executed to produce behavior or results.

  - id: as:tool
    name: Tool
    description: >
      A research software tool.

  - id: as:prototype
    name: Prototype
    description: >
      A research prototype or proof-of-concept.

  - id: as:data
    name: Data
    description: >
      A dataset or other research data artifact.


principles:

  - id: as:reproducible-installation
    name: Reproducible Installation — Generic

    method_type_tags:
      - as:benchmarking

    artifact_tags:
      - as:executable
      - as:tool
      - as:prototype

    rationale: >
      Research artifacts may depend on specific operating systems,
      software packages, libraries, and system configurations.
      Providing a reproducible installation environment reduces
      installation problems during artifact evaluation and makes
      execution more reproducible.

    implementations:

      - id: as:container-or-vm
        name: Container or Virtual Machine

        check_level: hygiene

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype

        rationale: >
          Packaging the artifact together with its execution environment
          reduces dependency-related installation problems and allows
          evaluators to execute the artifact in a preconfigured environment.

        creation_guidance:

          description: >
            Authors must provide their artifacts as Container
            (Docker or Podman) or VM (OVF/OVA) images. If the artifact
            requires a different submission format, authors should
            contact the artifact evaluation committee chairs.

          examples:
            - Docker image
            - Podman/OCI image
            - OVF virtual machine
            - OVA virtual appliance

        checks_guidance:

          human:

            - id: as:container-vm-human-check

              description: >
                Verify that the submitted artifact includes a Container
                (Docker or Podman) or VM (OVF/OVA) image and that the
                provided instructions explain how to execute it.

              evidence:
                - Container image
                - Dockerfile or Containerfile
                - OVF/OVA image
                - Execution instructions

          automated:

            checks:

              - id: as:container-present

                description: >
                  Verify that a container build definition is present
                  in the artifact package.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory containing the submitted artifact.
                    type: directory
                    required: false
                    default: "."
                    examples:
                      - "."
                      - "./artifact"

                  - id: container_definition
                    description: >
                      Name of the container build definition.
                    type: file
                    required: false
                    default: "Dockerfile"
                    examples:
                      - Dockerfile
                      - Containerfile

                command: >
                  test -f "${artifact_root}/${container_definition}"

                expected_result: >
                  Exit code 0.

              - id: as:vm-present

                description: >
                  Verify that an OVF or OVA virtual machine artifact
                  is present.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory containing the submitted artifact.
                    type: directory
                    required: false
                    default: "."
                    examples:
                      - "."
                      - "./artifact"

                command: >
                  find "${artifact_root}" -type f
                  \( -name "*.ovf" -o -name "*.ova" \)

                expected_result: >
                  At least one matching file is found.

            combination_rules:

              - id: as:packaging-present

                operator: OR

                checks:
                  - as:container-present
                  - as:vm-present

                description: >
                  The packaging requirement is satisfied when either
                  a supported container build definition or a supported
                  OVF/OVA virtual machine image is present.

  - id: as:hardware-disclosure
    name: Hardware Environment Disclosure

    method_type_tags:
      - as:benchmarking

    artifact_tags:
      - as:executable
      - as:tool
      - as:prototype

    rationale: >
      Performance results, timing measurements, and resource-sensitive
      behavior depend on the hardware an artifact was executed on.
      Without a record of the CPU, memory, storage, and accelerator
      configuration used, evaluators cannot interpret reported numbers,
      compare them across machines, or judge whether observed
      performance is reproducible on different hardware.

    implementations:

      - id: as:system-introspection-dump
        name: Raw System Introspection Dump

        method_type_tags:
          - as:benchmarking

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype

        rationale: >
          Capturing the verbatim output of standard system introspection
          utilities is the lowest-effort way to record the hardware an
          artifact ran on. It requires no hand-authored schema and is
          harder to misreport than a manually typed description, though
          it is not portable across operating systems and is not
          machine-checkable beyond file presence and shape.

        creation_guidance:

          description: >
            Authors should capture the output of standard hardware
            introspection tools (e.g., `lscpu -J`, `lshw -json`, `nproc`,
            `free -h`, and `nvidia-smi --query-gpu=... --format=csv` where
            a GPU was used) at the time benchmarks were run, and commit
            this output alongside the results as `hardware.json` and/or
            a human-readable `HARDWARE.md` summary at the artifact root.
            If benchmarks were run on more than one machine, authors
            should provide one dump per machine, named accordingly
            (e.g., `hardware-node1.json`).

          examples:
            - hardware.json (lscpu -J output)
            - hardware.json (lshw -json output)
            - HARDWARE.md (hand-summarized from the above)
            - hardware-node1.json / hardware-node2.json (multi-machine)

        checks_guidance:

          human:

            - id: as:hardware-dump-human-check

              description: >
                Verify that a hardware description file is present at
                the artifact root (one per machine, for multi-node
                benchmarks) and that it identifies at minimum the CPU
                model, core/thread count, and total memory used during
                the reported benchmarks; and, where a GPU was used, the
                GPU model and memory.

              evidence:
                - hardware.json
                - HARDWARE.md
                - Benchmark scripts referencing the hardware file

          automated:

            checks:

              - id: as:hardware-file-present

                description: >
                  Verify that a hardware description file is present
                  in the artifact package.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory containing the submitted artifact.
                    type: directory
                    required: false
                    default: "."
                    examples:
                      - "."
                      - "./artifact"

                  - id: hardware_file_pattern
                    description: >
                      Filename pattern(s) accepted as a hardware
                      description file.
                    type: string
                    required: false
                    default: "hardware*.json|HARDWARE.md"
                    examples:
                      - hardware.json
                      - hardware-node1.json
                      - HARDWARE.md

                command: >
                  find "${artifact_root}" -maxdepth 2 -type f
                  \( -iname "hardware*.json" -o -iname "HARDWARE.md" \)

                expected_result: >
                  At least one matching file is found.

              - id: as:hardware-json-well-formed

                description: >
                  Verify that any hardware.json file is well-formed
                  JSON and contains identifiable CPU information (a
                  "model name" field from lscpu, or a "product" field
                  under a class="processor" node from lshw).

                inputs:

                  - id: hardware_json_path
                    description: >
                      Path to the hardware.json file to validate.
                    type: file
                    required: false
                    default: "./hardware.json"
                    examples:
                      - "./hardware.json"
                      - "./hardware-node1.json"

                command: >
                  jq -e '.. | objects | select(has("model name") or
                  has("modelName") or has("product"))'
                  "${hardware_json_path}" > /dev/null

                expected_result: >
                  Exit code 0.

            combination_rules:

              - id: as:hardware-disclosure-satisfied

                operator: OR

                checks:
                  - as:hardware-file-present

                description: >
                  The disclosure requirement is satisfied when a
                  hardware description file is present. `as:hardware-json-valid`
                  is an additional quality check on well-formedness and
                  content, not required for the base requirement to
                  pass — this mirrors the ad hoc nature of the
                  practice: presence is checkable, semantic
                  completeness is not.
