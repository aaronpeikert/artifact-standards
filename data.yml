id: as:example
name: Artifact Standards Example

method_type_tags:

  - id: as:engineering-research
    name: Engineering Research
    description: >
      Research that invents and evaluates technological artifacts.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/EngineeringResearch

  - id: as:case-study
    name: Case Study
    description: >
      An empirical inquiry that investigates a contemporary phenomenon (the
      "case") in depth and within its real-world context, especially when the
      boundaries between phenomenon and context are unclear.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/CaseStudy

  - id: as:grounded-theory
    name: Grounded Theory
    description: >
      A study of a specific area of interest or phenomenon that involves
      iterative and interleaved rounds of qualitative data collection and
      analysis, leading to key patterns (e.g. concepts, categories).
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/GroundedTheory

  - id: as:qualitative-survey
    name: Qualitative Survey
    description: >
      Research comprising semi-structured or open-ended interviews.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/QualitativeSurveys

  # Quantitative
  - id: as:benchmarking
    name: Benchmarking
    description: >
      A study in which a software system is assessed using a standard tool
      (i.e. a benchmark) for competitively evaluating and comparing methods,
      techniques or systems according to specific characteristics such as
      performance, dependability, or security.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/Benchmarking

  - id: as:data-science
    name: Data Science
    description: >
      Studies that analyze software engineering phenomena or artifacts using
      data-centric analysis methods such as machine learning or other
      computational intelligence approaches as well as search-based approaches.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/DataScience

  - id: as:experiment
    name: Experiment
    description: >
      A study in which an intervention is deliberately introduced to observe
      its effects on some aspects of reality under controlled conditions.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/Experiments

  - id: as:longitudinal
    name: Longitudinal Study
    description: >
      A study focusing on the changes in and evolution of a phenomenon over
      time.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/Longitudinal

  - id: as:optimization-study
    name: Optimization Study
    description: >
      Research studies that focus on the formulation of software engineering
      problems as search problems, and apply optimization techniques to solve
      such problems.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/OptimizationStudies

  - id: as:quantitative-simulation
    name: Quantitative Simulation
    description: >
      A study that involves developing and using a mathematical model that
      imitates a real-world system's behavior, which often entails problem
      understanding, data collection, model development, verification,
      validation, design of experiments, data analysis, and implementation
      of results.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/QuantitativeSimulation

  - id: as:questionnaire-survey
    name: Questionnaire Survey
    description: >
      A study in which a sample of respondents answer a series of (mostly
      structured) questions, typically through a computerized or paper form.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/QuestionnaireSurveys

  - id: as:repository-mining
    name: Repository Mining
    description: >
      A study that quantitatively analyzes a dataset extracted from a platform
      hosting of structured or semi-structured text (e.g. a source code
      repository).
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/RepositoryMining

  # Literature Review
  - id: as:case-survey
    name: Case Survey
    description: >
      A study that aims to generalize results about a complex phenomenon by
      systematically converting qualitative descriptions available in published
      case studies into quantitative data and analyzing the converted data.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/CaseSurvey

  - id: as:systematic-review
    name: Systematic Review
    description: >
      A study that appraises, analyses, and synthesizes primary or secondary
      literature to provide a complete, exhaustive summary of current evidence
      regarding one or more specific topics or research questions.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/SystematicReviews

  # Other
  - id: as:meta-science
    name: Meta-Science
    description: >
      A paper that analyses an issue of research methodology or makes
      recommendations for conducting research.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/MetaScience

  - id: as:replication
    name: Replication
    description: >
      A study that deliberately repeats a previous study (the "original study")
      to determine whether its results can be reproduced.
      See https://www2.sigsoft.org/EmpiricalStandards/docs/standards/Replication


artifact_tags:

  - id: as:executable
    name: Executable
    description: >
      An artifact that can be executed to produce behavior or results.

  - id: as:tool
    name: Tool
    description: >
      A research software tool.

  - id: as:prototype
    name: Prototype
    description: >
      A research prototype or proof-of-concept.

  - id: as:data
    name: Data
    description: >
      A dataset or other research data artifact.

  - id: as:proof
    name: Proof
    description: >
      A machine-checkable proof or mechanized formalization.

  - id: as:external-service
    name: External Service
    description: >
      An artifact that depends on a commercial or otherwise externally
      hosted service at run time (e.g., a closed LLM accessed via an API).


principles:

  - id: as:reproducible-installation
    name: Reproducible Installation — Generic

    method_type_tags:
      - as:benchmarking

    artifact_tags:
      - as:executable
      - as:tool
      - as:prototype

    rationale: >
      Research artifacts may depend on specific operating systems,
      software packages, libraries, and system configurations.
      Providing a reproducible installation environment reduces
      installation problems during artifact evaluation and makes
      execution more reproducible.

    implementations:

      - id: as:container-or-vm
        name: Container or Virtual Machine

        check_level: hygiene

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype

        rationale: >
          Packaging the artifact together with its execution environment
          reduces dependency-related installation problems and allows
          evaluators to execute the artifact in a preconfigured environment.

        creation_guidance:

          description: >
            Authors must provide their artifacts as Container
            (Docker or Podman) or VM (OVF/OVA) images. If the artifact
            requires a different submission format, authors should
            contact the artifact evaluation committee chairs.

          examples:
            - Docker image
            - Podman/OCI image
            - OVF virtual machine
            - OVA virtual appliance

        checks_guidance:

          human:

            - id: as:container-vm-human-check

              description: >
                Verify that the submitted artifact includes a Container
                (Docker or Podman) or VM (OVF/OVA) image and that the
                provided instructions explain how to execute it.

              evidence:
                - Container image
                - Dockerfile or Containerfile
                - OVF/OVA image
                - Execution instructions

          automated:

            checks:

              - id: as:container-present

                description: >
                  Verify that a container build definition is present
                  in the artifact package.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory containing the submitted artifact.
                    type: directory
                    required: false
                    default: "."
                    examples:
                      - "."
                      - "./artifact"

                  - id: container_definition
                    description: >
                      Name of the container build definition.
                    type: file
                    required: false
                    default: "Dockerfile"
                    examples:
                      - Dockerfile
                      - Containerfile

                command: >
                  test -f "${artifact_root}/${container_definition}"

                expected_result: >
                  Exit code 0.

              - id: as:vm-present

                description: >
                  Verify that an OVF or OVA virtual machine artifact
                  is present.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory containing the submitted artifact.
                    type: directory
                    required: false
                    default: "."
                    examples:
                      - "."
                      - "./artifact"

                command: >
                  find "${artifact_root}" -type f
                  \( -name "*.ovf" -o -name "*.ova" \)

                expected_result: >
                  At least one matching file is found.

            combination_rules:

              - id: as:packaging-present

                operator: OR

                checks:
                  - as:container-present
                  - as:vm-present

                description: >
                  The packaging requirement is satisfied when either
                  a supported container build definition or a supported
                  OVF/OVA virtual machine image is present.

      - id: as:smoke-test
        name: Installation Smoke Tests

        check_level: hygiene

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype

        rationale: >
          Smoke tests ensuring the artifact seems to run properly one someone
          else's computer is a good sanity check.

        creation_guidance:

          description: >
            Authors should provide a short smoke test that exercises the
            artifact's basic startup and a representative operation, with
            instructions for running it after installation.

          examples:
            - A command that prints the tool's version or help
            - A minimal example invocation with expected output

        checks_guidance:

          human:

            - id: as:smoke-test-human-check

              description: >
                Verify that the artifact includes instructions for running
                a smoke test and that the test completes successfully after
                following the documented installation steps.

              evidence:
                - Smoke-test instructions
                - Test output or logs

      - id: as:self-contained
        name: Self-contained Artifact

        check_level: hygiene

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype

        rationale: >
          Artifacts should be self-contained to ensure long-term preservation. In particular, downloading content over the internet during build, experiments or tests is heavily discouraged.

        creation_guidance:

          description: >
            Authors should include or otherwise make available all required
            dependencies and inputs so that installation, builds, experiments,
            and tests can run without downloading content over the internet.

          examples:
            - Dependency lockfiles and locally available packages
            - Scripts that use bundled inputs instead of downloading them

        checks_guidance:

          human:

            - id: as:self-contained-human-check

              description: >
                Inspect the installation, build, experiment, and test
                instructions and scripts for network downloads, then verify
                that these steps can run with network access disabled.

              evidence:
                - Installation, build, experiment, and test scripts
                - Logs from running these steps without network access

  - id: as:hardware-disclosure
    name: Hardware Environment Disclosure

    method_type_tags:
      - as:benchmarking

    artifact_tags:
      - as:executable
      - as:tool
      - as:prototype

    rationale: >
      Performance results, timing measurements, and resource-sensitive
      behavior depend on the hardware an artifact was executed on.
      Without a record of the CPU, memory, storage, and accelerator
      configuration used, evaluators cannot interpret reported numbers,
      compare them across machines, or judge whether observed
      performance is reproducible on different hardware.

    implementations:

      - id: as:system-introspection-dump
        name: Raw System Introspection Dump

        method_type_tags:
          - as:benchmarking

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype

        rationale: >
          Capturing the verbatim output of standard system introspection
          utilities is the lowest-effort way to record the hardware an
          artifact ran on. It requires no hand-authored schema and is
          harder to misreport than a manually typed description, though
          it is not portable across operating systems and is not
          machine-checkable beyond file presence and shape.

        creation_guidance:

          description: >
            Authors should capture the output of standard hardware
            introspection tools (e.g., `lscpu -J`, `lshw -json`, `nproc`,
            `free -h`, and `nvidia-smi --query-gpu=... --format=csv` where
            a GPU was used) at the time benchmarks were run, and commit
            this output alongside the results as `hardware.json` and/or
            a human-readable `HARDWARE.md` summary at the artifact root.
            If benchmarks were run on more than one machine, authors
            should provide one dump per machine, named accordingly
            (e.g., `hardware-node1.json`).

          examples:
            - hardware.json (lscpu -J output)
            - hardware.json (lshw -json output)
            - HARDWARE.md (hand-summarized from the above)
            - hardware-node1.json / hardware-node2.json (multi-machine)

        checks_guidance:

          human:

            - id: as:hardware-dump-human-check

              description: >
                Verify that a hardware description file is present at
                the artifact root (one per machine, for multi-node
                benchmarks) and that it identifies at minimum the CPU
                model, core/thread count, and total memory used during
                the reported benchmarks; and, where a GPU was used, the
                GPU model and memory.

              evidence:
                - hardware.json
                - HARDWARE.md
                - Benchmark scripts referencing the hardware file

          automated:

            checks:

              - id: as:hardware-file-present

                description: >
                  Verify that a hardware description file is present
                  in the artifact package.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory containing the submitted artifact.
                    type: directory
                    required: false
                    default: "."
                    examples:
                      - "."
                      - "./artifact"

                  - id: hardware_file_pattern
                    description: >
                      Filename pattern(s) accepted as a hardware
                      description file.
                    type: string
                    required: false
                    default: "hardware*.json|HARDWARE.md"
                    examples:
                      - hardware.json
                      - hardware-node1.json
                      - HARDWARE.md

                command: >
                  find "${artifact_root}" -maxdepth 2 -type f
                  \( -iname "hardware*.json" -o -iname "HARDWARE.md" \)

                expected_result: >
                  At least one matching file is found.

              - id: as:hardware-json-well-formed

                description: >
                  Verify that any hardware.json file is well-formed
                  JSON and contains identifiable CPU information (a
                  "model name" field from lscpu, or a "product" field
                  under a class="processor" node from lshw).

                inputs:

                  - id: hardware_json_path
                    description: >
                      Path to the hardware.json file to validate.
                    type: file
                    required: false
                    default: "./hardware.json"
                    examples:
                      - "./hardware.json"
                      - "./hardware-node1.json"

                command: >
                  jq -e '.. | objects | select(has("model name") or
                  has("modelName") or has("product"))'
                  "${hardware_json_path}" > /dev/null

                expected_result: >
                  Exit code 0.

            combination_rules:

              - id: as:hardware-disclosure-satisfied

                operator: OR

                checks:
                  - as:hardware-file-present

                description: >
                  The disclosure requirement is satisfied when a
                  hardware description file is present. `as:hardware-json-well-formed`
                  is an additional quality check on well-formedness and
                  content, not required for the base requirement to
                  pass — this mirrors the ad hoc nature of the
                  practice: presence is checkable, semantic
                  completeness is not.

  - id: as:data-availability
    name: Artifact Availability

    method_type_tags:
      - as:benchmarking

    artifact_tags:
      - as:executable
      - as:tool
      - as:prototype
      - as:data
      - as:proof

    rationale: >
      Ensure long-term availability of your artifact, so that readers can
      access exactly the version that supports the paper long after
      publication.

    implementations:

      - id: as:long-term-archival
        name: Use a long-term archival service

        check_level: hygiene

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype
          - as:data
          - as:proof

        rationale: >
          Artifacts hosted on institutional pages or commercial cloud services
          will disappear at some point, as observed by [Collberg and Proebsting
          (2016)](https://doi.org/10.1145/2812803). Code-hosting platforms
          such as GitHub, file-sharing services such as Dropbox or Google
          Drive, and personal websites do not guarantee long-term archival.

        creation_guidance:

          description: >
            Authors must deposit their artifacts in a long-term archival
            service with a declared plan for permanent accessibility. A link
            to a code-hosting platform (e.g., GitHub) may complement, but not
            replace, the archived copy.

          examples:
            - Software Heritage (for software repositories)
            - Zenodo
            - FigShare
            - Dryad

        checks_guidance:

          human:

            - id: as:long-term-archival-human-check

              description: >
                Verify that the artifact link points to a long-term archival
                service (not a code-hosting platform, file-sharing service, or
                personal website) and that the archived content matches the
                submitted artifact.

              evidence:
                - Artifact URL or DOI
                - Archived record landing page

          automated:

            checks:

              - id: as:artifact-availability-whitelist

                description: >
                  Verify that the submitted artifact is hosted on one long-term
                  archival service.

                inputs:

                  - id: artifact_url
                    description: >
                      URL where the artifact is hosted.
                    type: uri
                    required: true
                    examples:
                      - "https://zenodo.org/records/14677860"
                      - "https://doi.org/10.5281/zenodo.14677860"

                  - id: allowed_archives
                    description: >
                      Extended regular expression of accepted archive URLs.
                    type: string
                    required: false
                    default: "^https://(doi\\.org/10\\.5281/zenodo\\.|zenodo\\.org/|archive\\.softwareheritage\\.org/|(www\\.)?figshare\\.com/|doi\\.org/10\\.6084/m9\\.figshare\\.|datadryad\\.org/|doi\\.org/10\\.5061/dryad\\.)"

                command: >
                  [[ "${artifact_url}" =~ ${allowed_archives} ]]
                expected_result: >
                  Exit code 0.

      - id: as:persistent-identifier
        name: Persistent Identifier (DOI)

        check_level: hygiene

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype
          - as:data
          - as:proof

        rationale: >
          A persistent identifier such as a DOI resolves to the archived
          artifact even if the hosting URL changes, and lets the paper cite
          the exact version that was evaluated (e.g., in a data availability
          statement).

        creation_guidance:

          description: >
            Authors should obtain a DOI for the archived version of the
            artifact (archives such as Zenodo, FigShare, or Dryad mint one on
            publication) and reference it in the paper, ideally in a data
            availability statement. The DOI should identify a specific
            version, not only a concept record.

          examples:
            - Zenodo version DOI (10.5281/zenodo.NNNNNNN)
            - Software Heritage identifier (SWHID) in addition to a DOI
            - Data availability statement citing the DOI

        checks_guidance:

          human:

            - id: as:persistent-identifier-human-check

              description: >
                Verify that the artifact has a DOI, that it resolves to the
                archived artifact, and that the paper references it.

              evidence:
                - DOI
                - Paper's data availability statement

          automated:

            checks:

              - id: as:doi-resolves

                description: >
                  Verify that the DOI resolves via doi.org.

                inputs:

                  - id: doi
                    description: >
                      DOI of the archived artifact, without the resolver prefix.
                    type: string
                    required: true
                    examples:
                      - "10.5281/zenodo.14677860"

                command: >
                  curl -fsIL -o /dev/null "https://doi.org/${doi}"

                expected_result: >
                  Exit code 0.

  - id: as:reproducible-results
    name: Reproducible Experimental Results

    artifact_tags:
      - as:executable
      - as:tool

    rationale: >
      Ensure experimental claims from a paper can be reproducible through the artifact.

    implementations:
      - id: as:claim-reproduction
        name: Experimental Claim Reproduction
        check_level: hygiene

        rationale: >
          Include a list of claims supported by the artifact, and how they are
          supported. Similarly for unsupported claims.

        creation_guidance:
          description: >
            Authors should list the paper's experimental claims and identify
            which claims the artifact supports, how it supports them, and which
            claims are not supported.

        checks_guidance:
          human:
            - id: as:claim-reproduction-human-check
              description: >
                Verify that the artifact documents the paper's experimental
                claims and explains which are supported or unsupported.
              evidence:
                - Claim-to-artifact mapping
                - Explanation of unsupported claims

      - id: as:push-button-evaluation
        name: Push-button evaluation
        check_level: quality # hygiene eventually?

        rationale: >
          Ideally, the whole evaluation can be run through a single script,
          which performs the computation and generates the relevant
          figures/experimental data presented in the paper. The evaluation
          should either display progress messages or expected duration should be
          provided. This fully automated approach may be a bit more costly to
          setup, but you won’t have any copy/pasting issues for your paper, and
          regenerating figures from new data is much faster.

        creation_guidance:
          description: >
            Authors should provide a single script that runs the evaluation
            and generates the figures or experimental data reported in the
            paper, with progress messages or an expected duration.

        checks_guidance:
          human:
            - id: as:push-button-evaluation-human-check
              description: >
                Run the provided evaluation script and verify that it produces
                the reported figures or experimental data.
              evidence:
                - Evaluation script
                - Generated figures or experimental data

      - id: as:scaled-down-evaluation
        name: Scaled down version for larger evaluation
        check_level: hygiene

        rationale: >
          If the artifact takes more than one day to run on conventional
          hardware, we recommend additionally providing a reduced input set to
          only partially reproduce your results in a shorter time.

        creation_guidance:
          description: >
            Authors whose full evaluation takes more than one day should
            provide a reduced input set that allows representative results
            to be reproduced more quickly.

        checks_guidance:
          human:
            - id: as:scaled-down-evaluation-human-check
              description: >
                Verify that a reduced input set is provided and can be used
                to run a shortened evaluation.
              evidence:
                - Reduced input set
                - Instructions or script for running the shortened evaluation

  - id: as:artifact-documentation
    name: Artifact Documentation — Generic

    artifact_tags:
      - as:executable
      - as:tool
      - as:prototype
      - as:data
      - as:proof

    rationale: >
      Evaluators and future users meet the artifact without the authors'
      context. Documentation that separates a quick first contact from the
      full walkthrough lets them confirm early that the artifact works and
      then find their way to every claim it supports.

    implementations:

      - id: as:readme-getting-started
        name: README with Getting Started Guide

        check_level: hygiene

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype
          - as:data
          - as:proof

        rationale: >
          A short, bounded first step (describe, install, smoke-test) surfaces
          setup problems early, when they are still cheap to fix, and tells
          evaluators whether the rest of the evaluation is worth attempting.

        creation_guidance:

          description: >
            Provide a README (plain text, Markdown, or PDF) at the artifact
            root whose first part is a Getting Started guide: what the
            artifact is, installation instructions (if any), and a smoke test
            with its expected output. An evaluator should be able to complete
            the Getting Started guide within the venue's time budget
            (parameter `getting_started_minutes`). Its second part gives the
            step-by-step instructions for the paper's experiments (see
            `as:claim-reproduction`).

          examples:
            - README.md with sections "Getting Started" and "Step-by-Step Instructions"
            - Smoke test such as `docker run artifact ./smoke.sh` followed by the expected console output

        checks_guidance:

          human:

            - id: as:readme-getting-started-human-check

              description: >
                Follow the Getting Started guide on a fresh machine and verify
                that it describes the artifact, that installation succeeds,
                and that the smoke test produces the documented output within
                the time budget.

              evidence:
                - README Getting Started section
                - Smoke test output compared with the documented expected output
                - Time taken to complete the guide

          automated:

            checks:

              - id: as:readme-present

                description: >
                  Check that a README file is present at the artifact root.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory of the submitted artifact.
                    type: directory
                    required: false
                    default: "."

                command: >
                  find "${artifact_root}" -maxdepth 1 -type f -iname "README*"
                  | grep -q .

                expected_result: >
                  Exit code 0.

      - id: as:reuse-documentation
        name: Documentation for Reuse and Repurposing

        check_level: quality

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype
          - as:data

        rationale: >
          Reproducing the paper's results shows that an artifact works;
          documentation of its structure and of how to apply it beyond the
          paper's experiments is what lets others build on it.

        creation_guidance:

          description: >
            In addition to reproduction instructions, document how to use the
            artifact on inputs or experiments beyond those in the paper, and
            describe the layout of the code or data so that others can extend
            or repurpose it.

          examples:
            - README section "Using the tool on your own project"
            - Overview of the source tree and main extension points
            - API documentation or a data dictionary

        checks_guidance:

          human:

            - id: as:reuse-documentation-human-check

              description: >
                Verify that the documentation explains how to apply the
                artifact to new inputs and describes its structure well
                enough that an evaluator could adapt it, e.g., by running it
                on an input not used in the paper.

              evidence:
                - Usage documentation beyond the paper's experiments
                - Code or data layout documentation

  - id: as:declared-requirements
    name: Declared Requirements — Generic

    artifact_tags:
      - as:executable
      - as:tool
      - as:prototype
      - as:data
      - as:proof

    rationale: >
      Evaluators have to provision a suitable environment before they can
      start. Declaring hardware and software requirements up front lets them
      choose a machine, spot unmet needs such as GPUs or special peripherals,
      and avoid failures that have nothing to do with the artifact.

    implementations:

      - id: as:requirements-file
        name: REQUIREMENTS File

        check_level: hygiene

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype
          - as:data
          - as:proof

        rationale: >
          A dedicated file at a predictable location makes requirements easy
          to find and to compare against the evaluator's machine.

        creation_guidance:

          description: >
            Provide a REQUIREMENTS file at the artifact root that states the
            CPU architecture (e.g., x86-64, ARM) and the hardware and
            software the artifact needs, such as storage, memory, GPUs or
            other non-commodity peripherals, the operating system, and the
            container or VM runtime. Machine-readable dependency
            specifications are encouraged in addition.

          examples:
            - "REQUIREMENTS.md: x86-64, 16 GB RAM, 50 GB disk, Docker 24+, optional NVIDIA GPU with 12 GB"
            - Dockerfile, Pipfile, requirements.txt, renv.lock, or dune-project

        checks_guidance:

          human:

            - id: as:requirements-file-human-check

              description: >
                Verify that the REQUIREMENTS file names the architecture and
                the hardware and software needed, and that these match what
                running the artifact actually required.

              evidence:
                - REQUIREMENTS file
                - Machine-readable dependency files

          automated:

            checks:

              - id: as:requirements-file-present

                description: >
                  Check that a REQUIREMENTS file is present at the artifact root.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory of the submitted artifact.
                    type: directory
                    required: false
                    default: "."

                command: >
                  find "${artifact_root}" -maxdepth 1 -type f -iname "REQUIREMENTS*"
                  | grep -q .

                expected_result: >
                  Exit code 0.

  - id: as:licensing
    name: Licensing — Generic

    artifact_tags:
      - as:executable
      - as:tool
      - as:prototype
      - as:data
      - as:proof

    rationale: >
      Without a license, others have no right to use, modify, or redistribute
      an artifact, even if it is publicly accessible. An explicit license is
      therefore a precondition for availability and reuse.

    implementations:

      - id: as:license-file
        name: LICENSE File

        check_level: hygiene

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype
          - as:data
          - as:proof

        rationale: >
          A LICENSE file at the artifact root is the conventional, easily
          detected place to declare terms of use and distribution rights.

        creation_guidance:

          description: >
            Provide a LICENSE file at the artifact root stating the terms of
            use and distribution. Prefer an open-source license for software
            and an open data license for data. For an availability badge, the
            license must allow public access to the artifact.

          examples:
            - MIT, Apache-2.0, or GPL-3.0 for software
            - CC-BY-4.0 or CC0-1.0 for data
            - REUSE-compliant LICENSES/ directory for mixed licensing

        checks_guidance:

          human:

            - id: as:license-file-human-check

              description: >
                Verify that the license covers all parts of the artifact and
                permits the access and use the claimed badges require.

              evidence:
                - LICENSE file
                - Licenses of bundled third-party components

          automated:

            checks:

              - id: as:license-file-present

                description: >
                  Check that a LICENSE or COPYING file is present at the
                  artifact root.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory of the submitted artifact.
                    type: directory
                    required: false
                    default: "."

                command: >
                  find "${artifact_root}" -maxdepth 1 -type f
                  \( -iname "LICENSE*" -o -iname "LICENCE*" -o -iname "COPYING*" \)
                  | grep -q .

                expected_result: >
                  Exit code 0.

  - id: as:evaluation-self-description
    name: Evaluation Self-Description — Generic

    artifact_tags:
      - as:executable
      - as:tool
      - as:prototype
      - as:data
      - as:proof

    rationale: >
      Evaluators decide what to assess based on what the authors claim.
      Stating the badges sought, with a justification and a short overview of
      the artifact, aligns expectations before evaluation starts and makes
      the decision traceable.

    implementations:

      - id: as:status-file
        name: STATUS File with Badge Claims

        check_level: hygiene

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype
          - as:data
          - as:proof

        rationale: >
          A dedicated file states which badges the authors apply for and why,
          so evaluators can judge the artifact against those criteria.

        creation_guidance:

          description: >
            Provide a STATUS file at the artifact root that lists the badges
            applied for and briefly justifies why the artifact meets the
            criteria of each.

          examples:
            - "STATUS.md: Applying for Available and Reusable. Available: archived on Zenodo with DOI ... Reusable: ..."

        checks_guidance:

          human:

            - id: as:status-file-human-check

              description: >
                Verify that the STATUS file names the badges applied for and
                that each claim is justified with respect to the venue's
                badge criteria.

              evidence:
                - STATUS file

          automated:

            checks:

              - id: as:status-file-present

                description: >
                  Check that a STATUS file is present at the artifact root.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory of the submitted artifact.
                    type: directory
                    required: false
                    default: "."

                command: >
                  find "${artifact_root}" -maxdepth 1 -type f -iname "STATUS*"
                  | grep -q .

                expected_result: >
                  Exit code 0.

      - id: as:artifact-abstract
        name: Artifact Abstract

        check_level: hygiene

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype
          - as:data
          - as:proof

        rationale: >
          A short, structured overview lets evaluators (and later readers)
          judge the artifact's purpose, requirements, and provenance without
          reading the whole package or the paper first.

        creation_guidance:

          description: >
            Include a short abstract (within the venue's page limit,
            parameter `max_pages`) covering: the paper title and a link to
            the paper accessible to evaluators; the artifact's purpose; the
            badges applied for and why; the technical skills and hardware
            needed to evaluate it; its provenance (where it can be obtained);
            and instructions on how to access and use it, including, for
            datasets, an explanation of the data, its schema, and usage
            scenarios.

          examples:
            - ABSTRACT.pdf with the seven sections listed above

        checks_guidance:

          human:

            - id: as:artifact-abstract-human-check

              description: >
                Verify that the abstract stays within the page limit and
                covers paper, purpose, badges, required skills and hardware,
                provenance, and usage instructions.

              evidence:
                - Artifact abstract

  - id: as:external-service-access
    name: Access to External Services — Generic

    artifact_tags:
      - as:external-service
      - as:executable

    rationale: >
      Artifacts that call commercial or remotely hosted services (e.g.,
      closed LLMs) cannot be evaluated, or later reused, unless the service
      stays reachable. Access arrangements must also not expose evaluators'
      identities to the authors or leak credentials.

    implementations:

      - id: as:evaluator-service-credentials
        name: Evaluator Credentials for External Services

        check_level: hygiene

        artifact_tags:
          - as:external-service

        rationale: >
          Supplying dedicated, limited credentials for the evaluation period
          keeps the service usable while bounding the authors' cost and risk
          and keeping evaluators anonymous.

        creation_guidance:

          description: >
            Keep required external services accessible for the whole
            evaluation period without requiring evaluators to identify
            themselves. Provide credentials (e.g., API keys) through the
            venue's confidential submission channel, never inside the
            archived artifact, and rate-limit or budget-cap them where
            possible. Document which results depend on the service, the
            model or service version used, and, where feasible, cached
            responses that allow re-running the analysis without the service.

          examples:
            - Dedicated, spend-capped API key entered in the submission form
            - Recorded LLM responses (e.g., JSONL) with the model version and date

        checks_guidance:

          human:

            - id: as:evaluator-service-credentials-human-check

              description: >
                Verify that the external service is reachable with the
                provided credentials without revealing the evaluator's
                identity, that no credentials are embedded in the archived
                artifact, and that the service version is documented.

              evidence:
                - Credentials supplied via the submission system
                - Documentation of service dependencies and versions
                - Cached responses, if provided

  - id: as:dataset-documentation
    name: Dataset Documentation — Generic

    method_type_tags:
      - as:repository-mining
      - as:data-science
      - as:questionnaire-survey
      - as:experiment
      - as:case-study
      - as:qualitative-survey

    artifact_tags:
      - as:data

    rationale: >
      Data cannot be interpreted, trusted, or reused without knowing where it
      came from, how it was collected, what it contains, and under which
      ethical and legal conditions it may be used.

    implementations:

      - id: as:dataset-description
        name: Dataset Description (Datasheet)

        check_level: hygiene

        artifact_tags:
          - as:data

        rationale: >
          A structured description, in the spirit of datasheets for datasets,
          answers the questions every data user has before they can use the
          data responsibly.

        creation_guidance:

          description: >
            Describe the dataset's context (why and for which study it was
            created), provenance (sources, collection and processing steps),
            ethical and legal considerations (consent, ethics approval,
            anonymization, licenses of the sources), and storage. Document its
            features and schema (e.g., columns, types, units, codes) and list
            intended usage scenarios.

          examples:
            - DATASHEET.md following Gebru et al., "Datasheets for Datasets"
            - Codebook or data dictionary describing each column
            - Frictionless Data package (datapackage.json) with a table schema

        checks_guidance:

          human:

            - id: as:dataset-description-human-check

              description: >
                Verify that the documentation covers context, provenance,
                ethics and legal aspects, storage, schema, and usage
                scenarios, and that the schema matches the files provided.

              evidence:
                - Dataset documentation
                - Data dictionary or schema
                - Ethics approval or consent statement, if applicable

  - id: as:accessible-formats
    name: Accessible File Formats — Generic

    artifact_tags:
      - as:data
      - as:executable

    rationale: >
      Files in proprietary or obscure formats may become unreadable or
      require paid software. Open, widely supported formats and a single,
      standard package keep the artifact accessible to evaluators today and
      to readers in the future.

    implementations:

      - id: as:open-file-formats
        name: Open, Widely Supported Formats

        check_level: hygiene

        artifact_tags:
          - as:data

        rationale: >
          Open formats can be read with freely available tools on any
          platform, and listing the tools needed removes guesswork.

        creation_guidance:

          description: >
            Package non-executable artifacts as a single, optionally
            compressed archive in a standard format, store contents in open
            and widely supported formats, and list the tools needed to open
            each file type. Avoid closed-source libraries, operating systems,
            or formats unless they are essential to the research.

          examples:
            - Archive formats .zip, .tar, .tar.gz
            - Data formats CSV, JSON, Parquet; documents PDF, ODT, Markdown

        checks_guidance:

          human:

            - id: as:open-file-formats-human-check

              description: >
                Verify that the artifact is a single standard archive, that
                its files use open formats or that proprietary formats are
                justified, and that the tools needed to open them are listed.

              evidence:
                - Archive file
                - List of file formats and the tools to open them

  - id: as:proof-correspondence
    name: Proof–Paper Correspondence — Generic

    artifact_tags:
      - as:proof

    rationale: >
      A mechanized proof supports a paper only if readers can tell which
      formal statements correspond to which definitions and theorems in the
      paper, and which assumptions remain unproven.

    implementations:

      - id: as:proof-to-paper-mapping
        name: Mapping from Paper to Mechanized Proof

        check_level: hygiene

        artifact_tags:
          - as:proof

        rationale: >
          An explicit mapping lets evaluators check proof coverage without
          reverse-engineering the formalization.

        creation_guidance:

          description: >
            Map each definition, lemma, and theorem in the paper to its
            counterpart in the proof development, and list every axiom,
            admitted lemma, or other unproven assumption, following the
            community guidelines for proof artifacts.

          examples:
            - README table "Theorem 3.2 → src/Soundness.v:soundness"
            - Output of Print Assumptions (Coq/Rocq) or #print axioms (Lean)
            - https://proofartifacts.github.io/guidelines/

        checks_guidance:

          human:

            - id: as:proof-to-paper-mapping-human-check

              description: >
                Verify that the mapping covers the paper's formal claims,
                that the proof checks with the stated prover version, and
                that all unproven assumptions are disclosed.

              evidence:
                - Paper-to-proof mapping
                - Proof checker output
                - List of axioms and admitted lemmas
