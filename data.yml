id: as:example
name: Artifact Standards Example

method_type_tags:

  - id: as:artifact-evaluation
    name: Artifact Evaluation
    description: >
      Evaluation of research artifacts accompanying a scientific
      publication.

  - id: as:benchmarking
    name: Benchmarking
    description: >
      Studies that evaluate performance or behavior using benchmarks.


artifact_tags:

  - id: as:executable
    name: Executable
    description: >
      An artifact that can be executed to produce behavior or results.

  - id: as:tool
    name: Tool
    description: >
      A research software tool.

  - id: as:prototype
    name: Prototype
    description: >
      A research prototype or proof-of-concept.

  - id: as:data
    name: Data
    description: >
      A dataset or other research data artifact.


principles:

  - id: as:reproducible-installation
    name: Reproducible Installation — Generic

    method_type_tags:
      - as:artifact-evaluation
      - as:benchmarking

    artifact_tags:
      - as:executable
      - as:tool
      - as:prototype

    rationale: >
      Research artifacts may depend on specific operating systems,
      software packages, libraries, and system configurations.
      Providing a reproducible installation environment reduces
      installation problems during artifact evaluation and makes
      execution more reproducible.

    implementations:

      - id: as:container-or-vm
        name: Container or Virtual Machine

        check_level: hygiene

        method_type_tags:
          - as:artifact-evaluation

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype

        rationale: >
          Packaging the artifact together with its execution environment
          reduces dependency-related installation problems and allows
          evaluators to execute the artifact in a preconfigured environment.

        creation_guidance:

          description: >
            Authors must provide their artifacts as Container
            (Docker or Podman) or VM (OVF/OVA) images. If the artifact
            requires a different submission format, authors should
            contact the artifact evaluation committee chairs.

          examples:
            - Docker image
            - Podman/OCI image
            - OVF virtual machine
            - OVA virtual appliance

        checks_guidance:

          human:

            - id: as:container-vm-human-check

              description: >
                Verify that the submitted artifact includes a Container
                (Docker or Podman) or VM (OVF/OVA) image and that the
                provided instructions explain how to execute it.

              evidence:
                - Container image
                - Dockerfile or Containerfile
                - OVF/OVA image
                - Execution instructions

          automated:

            checks:

              - id: as:container-present

                description: >
                  Verify that a container build definition is present
                  in the artifact package.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory containing the submitted artifact.
                    type: directory
                    required: false
                    default: "."
                    examples:
                      - "."
                      - "./artifact"

                  - id: container_definition
                    description: >
                      Name of the container build definition.
                    type: file
                    required: false
                    default: "Dockerfile"
                    examples:
                      - Dockerfile
                      - Containerfile

                command: >
                  test -f "${artifact_root}/${container_definition}"

                expected_result: >
                  Exit code 0.

              - id: as:vm-present

                description: >
                  Verify that an OVF or OVA virtual machine artifact
                  is present.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory containing the submitted artifact.
                    type: directory
                    required: false
                    default: "."
                    examples:
                      - "."
                      - "./artifact"

                command: >
                  find "${artifact_root}" -type f
                  \( -name "*.ovf" -o -name "*.ova" \)

                expected_result: >
                  At least one matching file is found.

            combination_rules:

              - id: as:packaging-present

                operator: OR

                checks:
                  - as:container-present
                  - as:vm-present

                description: >
                  The packaging requirement is satisfied when either
                  a supported container build definition or a supported
                  OVF/OVA virtual machine image is present.

  - id: as:hardware-disclosure
    name: Hardware Environment Disclosure

    method_type_tags:
      - as:benchmarking
      - as:artifact-evaluation

    artifact_tags:
      - as:executable
      - as:tool
      - as:prototype

    rationale: >
      Performance results, timing measurements, and resource-sensitive
      behavior depend on the hardware an artifact was executed on.
      Without a record of the CPU, memory, storage, and accelerator
      configuration used, evaluators cannot interpret reported numbers,
      compare them across machines, or judge whether observed
      performance is reproducible on different hardware.

    implementations:

      - id: as:system-introspection-dump
        name: Raw System Introspection Dump

        method_type_tags:
          - as:benchmarking

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype

        rationale: >
          Capturing the verbatim output of standard system introspection
          utilities is the lowest-effort way to record the hardware an
          artifact ran on. It requires no hand-authored schema and is
          harder to misreport than a manually typed description, though
          it is not portable across operating systems and is not
          machine-checkable beyond file presence and shape.

        creation_guidance:

          description: >
            Authors should capture the output of standard hardware
            introspection tools (e.g., `lscpu -J`, `lshw -json`, `nproc`,
            `free -h`, and `nvidia-smi --query-gpu=... --format=csv` where
            a GPU was used) at the time benchmarks were run, and commit
            this output alongside the results as `hardware.json` and/or
            a human-readable `HARDWARE.md` summary at the artifact root.
            If benchmarks were run on more than one machine, authors
            should provide one dump per machine, named accordingly
            (e.g., `hardware-node1.json`).

          examples:
            - hardware.json (lscpu -J output)
            - hardware.json (lshw -json output)
            - HARDWARE.md (hand-summarized from the above)
            - hardware-node1.json / hardware-node2.json (multi-machine)

        checks_guidance:

          human:

            - id: as:hardware-dump-human-check

              description: >
                Verify that a hardware description file is present at
                the artifact root (one per machine, for multi-node
                benchmarks) and that it identifies at minimum the CPU
                model, core/thread count, and total memory used during
                the reported benchmarks; and, where a GPU was used, the
                GPU model and memory.

              evidence:
                - hardware.json
                - HARDWARE.md
                - Benchmark scripts referencing the hardware file

          automated:

            checks:

              - id: as:hardware-file-present

                description: >
                  Verify that a hardware description file is present
                  in the artifact package.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory containing the submitted artifact.
                    type: directory
                    required: false
                    default: "."
                    examples:
                      - "."
                      - "./artifact"

                  - id: hardware_file_pattern
                    description: >
                      Filename pattern(s) accepted as a hardware
                      description file.
                    type: string
                    required: false
                    default: "hardware*.json|HARDWARE.md"
                    examples:
                      - hardware.json
                      - hardware-node1.json
                      - HARDWARE.md

                command: >
                  find "${artifact_root}" -maxdepth 2 -type f
                  \( -iname "hardware*.json" -o -iname "HARDWARE.md" \)

                expected_result: >
                  At least one matching file is found.

              - id: as:hardware-json-well-formed

                description: >
                  Verify that any hardware.json file is well-formed
                  JSON and contains identifiable CPU information (a
                  "model name" field from lscpu, or a "product" field
                  under a class="processor" node from lshw).

                inputs:

                  - id: hardware_json_path
                    description: >
                      Path to the hardware.json file to validate.
                    type: file
                    required: false
                    default: "./hardware.json"
                    examples:
                      - "./hardware.json"
                      - "./hardware-node1.json"

                command: >
                  jq -e '.. | objects | select(has("model name") or
                  has("modelName") or has("product"))'
                  "${hardware_json_path}" > /dev/null

                expected_result: >
                  Exit code 0.

            combination_rules:

              - id: as:hardware-disclosure-satisfied

                operator: OR

                checks:
                  - as:hardware-file-present

                description: >
                  The disclosure requirement is satisfied when a
                  hardware description file is present. `as:hardware-json-valid`
                  is an additional quality check on well-formedness and
                  content, not required for the base requirement to
                  pass — this mirrors the ad hoc nature of the
                  practice: presence is checkable, semantic
                  completeness is not.

  - id: as:replication-package
    name: Replication Package — Generic

    method_type_tags:
      - as:artifact-evaluation

    artifact_tags:
      - as:executable
      - as:tool
      - as:prototype
      - as:data

    rationale: >
      A replication package bundles all materials needed to independently
      verify the paper's claims: the artifact, data, scripts, and
      documentation. Without a complete package, evaluators cannot
      systematically assess whether reported results hold beyond
      the paper's narrative.

    implementations:

      - id: as:readme-with-instructions
        name: README with Reproduction Instructions

        check_level: hygiene

        method_type_tags:
          - as:artifact-evaluation

        artifact_tags:
          - as:executable
          - as:tool
          - as:prototype

        rationale: >
          A README at the artifact root describing what the artifact
          does and how to reproduce results is the minimum entry point
          for evaluators. Without clear instructions, evaluators cannot
          begin assessment regardless of the artifact's quality.

        creation_guidance:

          description: >
            Provide a README.md (or README.txt) at the artifact root
            covering: (1) what the artifact is and which paper claims
            it supports, (2) system requirements and dependencies,
            (3) step-by-step reproduction instructions for key results,
            (4) expected output and how to interpret it, and
            (5) estimated runtime on reference hardware.

          examples:
            - README.md with sections Overview, Requirements, Reproducing Results, Expected Output
            - README.md referencing a run.sh entry point and listing required Docker version

        checks_guidance:

          human:

            - id: as:readme-human-check

              description: >
                Verify that a README is present and contains step-by-step
                instructions sufficient for an evaluator unfamiliar with
                the artifact to reproduce the paper's key results,
                including system requirements and expected output.

              evidence:
                - README.md or README.txt at artifact root
                - Step-by-step reproduction instructions
                - Listed system requirements
                - Description of expected output

          automated:

            checks:

              - id: as:readme-file-present

                description: >
                  Check that a README file is present at the artifact root.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory of the submitted artifact.
                    type: directory
                    required: false
                    default: "."

                command: >
                  find "${artifact_root}" -maxdepth 1 -type f -iname "README*"

                expected_result: >
                  At least one README file is found at the artifact root.

      - id: as:analysis-scripts
        name: Analysis Scripts

        check_level: quality

        method_type_tags:
          - as:artifact-evaluation

        artifact_tags:
          - as:data
          - as:executable
          - as:tool

        rationale: >
          Scripts that generated the tables, figures, and statistical
          results in the paper allow evaluators to verify that reported
          numbers match artifact outputs and enable independent
          reanalysis with alternative methods.

        creation_guidance:

          description: >
            Include all scripts used to generate figures, tables, and
            statistical results reported in the paper. Document which
            script produces which paper artifact (e.g., "run analysis.R
            to reproduce Figure 3 and Table 2"). Prefer a single entry
            point that runs all analyses.

          examples:
            - analysis.R or analysis.py generating all paper figures and tables
            - scripts/ directory with one script per figure named to match paper labels
            - Jupyter notebook reproducing all reported statistics with commentary

        checks_guidance:

          human:

            - id: as:analysis-scripts-human-check

              description: >
                Verify that scripts generating reported results (figures,
                tables, statistics) are present and that the README maps
                each script to the paper artifact it produces.

              evidence:
                - R, Python, Julia, or shell analysis scripts
                - Jupyter or R Markdown notebooks
                - README mapping scripts to paper figures or tables

          automated:

            checks:

              - id: as:analysis-script-present

                description: >
                  Check that at least one analysis script or notebook
                  is present in the artifact.

                inputs:

                  - id: artifact_root
                    description: >
                      Root directory of the submitted artifact.
                    type: directory
                    required: false
                    default: "."

                command: >
                  find "${artifact_root}" -type f
                  \( -name "*.R" -o -name "*.Rmd" -o -name "*.py"
                  -o -name "*.jl" -o -name "*.ipynb" \)

                expected_result: >
                  At least one analysis script or notebook is found.
