name: Validate data.yml

on:
  push:
    branches: [ "main" ]
    paths:
      - data.yml
      - venues.yml
      - schema.yml
      - .github/workflows/validate.yml
  pull_request:
    branches: [ "main" ]

jobs:
  rerun-open-prs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run validate on open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          prs=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].number')
          for pr in $prs; do
            run_id=$(gh api "repos/$REPO/actions/workflows/validate.yml/runs?event=pull_request&per_page=100" \
              --jq "[.workflow_runs[] | select(.pull_requests[].number == $pr)] | first | .id // empty")
            if [ -n "$run_id" ]; then
              echo "Re-running validate for PR #$pr (run $run_id)"
              gh api "repos/$REPO/actions/runs/$run_id/rerun" --method POST || true
            else
              echo "No previous validate run found for PR #$pr"
            fi
          done

  build:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test installation of linkml
      run: |
        linkml-validate --version
    - name: Validate data.yml
      run: |
        linkml-validate -s schema.yml data.yml
    - name: Validate venues.yml
      run: |
        linkml-validate -s schema.yml -C VenueRegistry venues.yml
    - name: Add comment success
      if: success() && (github.event_name == 'pull_request')
      uses: actions/github-script@v9
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          const issue_number = context.issue.number;
          const commentBody = `:white_check_mark: Validation succeeded`;
          const comment = { owner: context.repo.owner, repo: context.repo.repo, issue_number: issue_number, body: commentBody };
          github.rest.issues.createComment(comment);
    - name: Store failure output
      if: failure() && (github.event_name == 'pull_request')
      id: validate
      run: |
        validation_output=$(linkml-validate -s schema.yml data.yml 2>&1 || true)
        venues_output=$(linkml-validate -s schema.yml -C VenueRegistry venues.yml 2>&1 || true)
        echo "validation_output<<EOF" >> $GITHUB_ENV
        echo "$validation_output" >> $GITHUB_ENV
        echo "$venues_output" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
    - name: Add comment failure
      if: failure() && (github.event_name == 'pull_request')
      uses: actions/github-script@v9
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          const validationOutput = process.env.validation_output;
          // Filter out lines that start with 'INFO:'
          const relevantLines = validationOutput.split('\n').filter(line => !line.startsWith('INFO:'));
          if (relevantLines.length > 0) {
            const issue_number = context.issue.number;
            const commentBody = `:x: Validation Failed:\n${relevantLines.join('\n')}`;
            const comment = { owner: context.repo.owner, repo: context.repo.repo, issue_number: issue_number, body: commentBody };
            github.rest.issues.createComment(comment);
          }
